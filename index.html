<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sabarmati HSR Hub — Conference Room Booking</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f3;
      --bg-tertiary: #efefed;
      --text-primary: #1a1a18;
      --text-secondary: #6b6b67;
      --text-tertiary: #9e9e9a;
      --border-tertiary: rgba(0,0,0,0.1);
      --border-secondary: rgba(0,0,0,0.18);
      --radius-md: 8px;
      --radius-lg: 12px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1c1c1a;
        --bg-secondary: #252523;
        --bg-tertiary: #2e2e2b;
        --text-primary: #f0efe8;
        --text-secondary: #a0a09a;
        --text-tertiary: #6a6a65;
        --border-tertiary: rgba(255,255,255,0.08);
        --border-secondary: rgba(255,255,255,0.15);
      }
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 0 0 5rem;
    }

    .app { max-width: 680px; margin: 0 auto; background: var(--bg-tertiary); }

    /* Topbar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.25rem 0.75rem;
      background: var(--bg-primary);
      border-bottom: 0.5px solid var(--border-tertiary);
      margin-bottom: 1.25rem;
      position: sticky; top: 0; z-index: 10;
    }
    .topbar-logo { display: flex; align-items: center; gap: 10px; }
    .logo-dot { width: 32px; height: 32px; border-radius: 8px; background: #1D9E75; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logo-dot i { font-size: 17px; color: #fff; }
    .logo-text { font-size: 14px; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
    .logo-sub { font-size: 10px; color: var(--text-secondary); letter-spacing: 0.05em; text-transform: uppercase; margin-top: 1px; }
    .topbar-date { font-size: 12px; color: var(--text-secondary); text-align: right; line-height: 1.6; flex-shrink: 0; }
    .topbar-date strong { color: var(--text-primary); font-size: 13px; display: block; }

    /* Toast */
    .toast-bar {
      background: #085041; color: #E1F5EE; font-size: 13px;
      padding: 10px 1.25rem; margin: 0 1.25rem 1rem;
      border-radius: var(--radius-md);
      display: none; align-items: center; gap: 8px;
    }
    .toast-bar.show { display: flex; }

    /* Room banner */
    .room-banner {
      margin: 0 1.25rem 1.25rem;
      background: var(--bg-primary);
      border: 0.5px solid var(--border-tertiary);
      border-radius: var(--radius-lg);
      padding: 1rem 1.25rem;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .room-banner-left { display: flex; align-items: center; gap: 12px; }
    .room-icon { width: 42px; height: 42px; border-radius: 10px; background: #E1F5EE; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .room-icon i { font-size: 20px; color: #0F6E56; }
    .room-name { font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .room-meta { font-size: 12px; color: var(--text-secondary); margin-top: 3px; line-height: 1.5; }
    .room-status-badge { font-size: 12px; padding: 5px 12px; border-radius: 14px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
    .badge-free { background: #E1F5EE; color: #085041; }
    .badge-busy { background: #FAECE7; color: #712B13; }

    /* Section headers */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.25rem; margin-bottom: 0.75rem;
    }
    .section-title { font-size: 11px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.07em; text-transform: uppercase; }
    .btn-new {
      font-size: 13px; padding: 6px 14px; cursor: pointer;
      border: 0.5px solid #1D9E75; border-radius: var(--radius-md);
      background: transparent; color: #0F6E56;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-new:hover { background: #E1F5EE; }

    /* Timeline */
    .timeline-wrap { padding: 0 1.25rem; margin-bottom: 1.5rem; }
    .timeline-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }

    .timeline-scroll-wrap { overflow-x: auto; border-radius: var(--radius-md); }
    .timeline-scroll-wrap::-webkit-scrollbar { height: 4px; }
    .timeline-scroll-wrap::-webkit-scrollbar-track { background: var(--bg-secondary); }
    .timeline-scroll-wrap::-webkit-scrollbar-thumb { background: #9FE1CB; border-radius: 2px; }

    .timeline-grid {
      display: grid;
      gap: 2px;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 6px;
      min-width: max-content;
    }
    .tslot {
      height: 34px; width: 52px; border-radius: 4px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: background 0.12s;
      user-select: none;
    }
    .tslot .slot-hour { font-size: 9px; font-weight: 600; line-height: 1; }
    .tslot .slot-min  { font-size: 8px; line-height: 1; margin-top: 1px; opacity: 0.75; }
    .tslot.free     { background: #E1F5EE; color: #0F6E56; }
    .tslot.free:hover { background: #9FE1CB; }
    .tslot.booked   { background: #FAECE7; color: #993C1D; cursor: default; }
    .tslot.selected { background: #1D9E75; color: #fff; }

    .tslot-book-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .legend { display: flex; gap: 14px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-secondary); }
    .legend-dot { width: 10px; height: 10px; border-radius: 3px; }
    .btn-sm {
      font-size: 12px; color: #0F6E56; border: 0.5px solid #0F6E56;
      background: transparent; border-radius: var(--radius-md);
      padding: 5px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-sm:hover { background: #E1F5EE; }

    /* Filter tabs */
    .filter-tabs { display: flex; gap: 4px; padding: 0 1.25rem; margin-bottom: 1rem; }
    .ftab { font-size: 12px; padding: 5px 13px; border-radius: 16px; cursor: pointer; border: 0.5px solid var(--border-tertiary); background: transparent; color: var(--text-secondary); }
    .ftab.active { background: var(--bg-secondary); color: var(--text-primary); border-color: var(--border-secondary); font-weight: 500; }

    /* Booking cards */
    .bookings-list { padding: 0 1.25rem; display: flex; flex-direction: column; gap: 10px; }
    .booking-card {
      background: var(--bg-primary); border: 0.5px solid var(--border-tertiary);
      border-radius: var(--radius-lg); padding: 1rem 1.25rem;
      cursor: pointer; transition: border-color 0.15s;
    }
    .booking-card:hover { border-color: var(--border-secondary); }
    .booking-card.mine  { border-left: 3px solid #1D9E75; border-radius: 0 var(--radius-lg) var(--radius-lg) 0; }
    .booking-card.other { border-left: 3px solid #F0997B; border-radius: 0 var(--radius-lg) var(--radius-lg) 0; }
    .bc-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
    .bc-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .bc-time  { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .bc-badge { font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
    .badge-mine  { background: #E1F5EE; color: #085041; }
    .badge-other { background: #FAECE7; color: #712B13; }
    .bc-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .bc-avatar { width: 24px; height: 24px; border-radius: 50%; background: #E1F5EE; color: #085041; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; flex-shrink: 0; }
    .bc-avatar.other { background: #FAECE7; color: #712B13; }
    .bc-name { font-size: 13px; color: var(--text-secondary); }
    .bc-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .bc-btn { font-size: 12px; padding: 5px 10px; border-radius: var(--radius-md); cursor: pointer; border: 0.5px solid var(--border-secondary); background: transparent; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 4px; }
    .bc-btn:hover { background: var(--bg-secondary); }
    .bc-btn.primary { color: #0F6E56; border-color: #5DCAA5; }
    .bc-btn.primary:hover { background: #E1F5EE; }
    .bc-btn.danger  { color: #993C1D; border-color: #F0997B; }
    .bc-btn.danger:hover { background: #FAECE7; }

    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); font-size: 14px; }
    .empty-state i { font-size: 36px; display: block; margin-bottom: 10px; color: var(--text-tertiary); }
    .empty-state p { margin-top: 4px; font-size: 13px; color: var(--text-tertiary); }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--bg-primary); border-radius: var(--radius-lg); border: 0.5px solid var(--border-tertiary); width: 100%; max-width: 440px; padding: 1.5rem; max-height: 92vh; overflow-y: auto; }
    .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 1.25rem; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
    .modal label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 4px; margin-top: 14px; }
    .modal input, .modal select, .modal textarea {
      width: 100%; font-size: 14px; color: var(--text-primary);
      border: 0.5px solid var(--border-secondary); border-radius: var(--radius-md);
      background: var(--bg-secondary); padding: 8px 10px; font-family: var(--font-sans); outline: none;
    }
    .modal input:focus, .modal select:focus, .modal textarea:focus { border-color: #1D9E75; box-shadow: 0 0 0 2px rgba(29,158,117,0.15); }
    .modal textarea { min-height: 70px; resize: vertical; }
    .modal-actions { display: flex; gap: 8px; margin-top: 1.25rem; justify-content: flex-end; }
    .btn-cancel { font-size: 13px; padding: 8px 16px; cursor: pointer; border: 0.5px solid var(--border-secondary); border-radius: var(--radius-md); background: transparent; color: var(--text-secondary); }
    .btn-cancel:hover { background: var(--bg-secondary); }
    .btn-confirm { font-size: 13px; padding: 8px 18px; cursor: pointer; border: none; border-radius: var(--radius-md); background: #1D9E75; color: #fff; font-weight: 600; }
    .btn-confirm:hover { background: #0F6E56; }

    .detail-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 9px 0; border-bottom: 0.5px solid var(--border-tertiary); font-size: 13px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--text-secondary); flex-shrink: 0; }
    .detail-value { color: var(--text-primary); font-weight: 500; text-align: right; max-width: 65%; }

    .error-outline { outline: 1.5px solid #D85A30 !important; }
    .field-error { font-size: 11px; color: #D85A30; margin-top: 3px; }

    @media (max-width: 500px) {
      .topbar { padding: 0.75rem 1rem; }
      .room-banner, .toast-bar { margin-left: 1rem; margin-right: 1rem; }
      .section-header, .timeline-wrap, .bookings-list, .filter-tabs { padding-left: 1rem; padding-right: 1rem; }
      .logo-text { font-size: 13px; }
    }
  </style>
</head>
<body>

<div class="app">

  <div class="topbar">
    <div class="topbar-logo">
      <div class="logo-dot"><i class="ti ti-building"></i></div>
      <div>
        <div class="logo-text">Sabarmati HSR Hub</div>
        <div class="logo-sub">Room Booking</div>
      </div>
    </div>
    <div class="topbar-date">
      <strong id="today-date"></strong>
      <span id="today-day"></span>
    </div>
  </div>

  <div class="toast-bar" id="toast-bar">
    <i class="ti ti-circle-check" style="font-size:16px;"></i>
    <span id="toast-msg"></span>
  </div>

  <div class="room-banner">
    <div class="room-banner-left">
      <div class="room-icon"><i class="ti ti-layout-board"></i></div>
      <div>
        <div class="room-name">Conference Room</div>
        <div class="room-meta">Capacity: 10 &nbsp;·&nbsp; Ground Floor, Block B</div>
      </div>
    </div>
    <span class="room-status-badge" id="room-status-badge"></span>
  </div>

  <div class="section-header">
    <span class="section-title">Today's availability</span>
    <button class="btn-new" onclick="openBookModal()">
      <i class="ti ti-plus" style="font-size:13px;"></i> New booking
    </button>
  </div>

  <div class="timeline-wrap">
    <div class="timeline-label">Tap free slots to select, then book &nbsp;·&nbsp; 15-min intervals (9:00 AM – 6:00 PM)</div>
    <div class="timeline-scroll-wrap">
      <div class="timeline-grid" id="timeline-grid"></div>
    </div>
    <div class="tslot-book-row">
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#E1F5EE;border:1px solid #9FE1CB;"></div>Free</div>
        <div class="legend-item"><div class="legend-dot" style="background:#1D9E75;"></div>Selected</div>
        <div class="legend-item"><div class="legend-dot" style="background:#FAECE7;border:1px solid #F0997B;"></div>Booked</div>
      </div>
      <button class="btn-sm" id="book-sel-btn" style="display:none;" onclick="openBookModal()">
        <i class="ti ti-plus" style="font-size:13px;"></i> Book selected
      </button>
    </div>
  </div>

  <div class="section-header">
    <span class="section-title">Bookings</span>
    <span id="booking-count" style="font-size:12px;color:var(--text-secondary);"></span>
  </div>

  <div class="filter-tabs">
    <button class="ftab active" onclick="setFilter('all',this)">All</button>
    <button class="ftab" onclick="setFilter('mine',this)">Mine</button>
    <button class="ftab" onclick="setFilter('today',this)">Today</button>
  </div>

  <div class="bookings-list" id="bookings-list"></div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-inner"></div>
</div>

<script>
  // ── Config ──────────────────────────────────────────────
  const ME = "You", MI = "YO";
  const DAY_START = 9;   // 9:00 AM
  const DAY_END   = 18;  // 6:00 PM
  // Generate 15-min slots: [{index, hour, min, label, shortLabel}]
  const SLOTS = [];
  for (let h = DAY_START; h < DAY_END; h++) {
    for (let m = 0; m < 60; m += 15) {
      const idx = SLOTS.length;
      const ampm = h >= 12 ? "PM" : "AM";
      const h12  = h > 12 ? h - 12 : (h === 0 ? 12 : h);
      const mm   = m === 0 ? "00" : String(m);
      SLOTS.push({
        index: idx,
        hour: h,
        min: m,
        label: `${h12}:${mm} ${ampm}`,
        shortH: String(h12),
        shortM: m === 0 ? ":00" : `:${mm}`
      });
    }
  }
  const TOTAL_SLOTS = SLOTS.length; // 36 slots

  function slotIndex(hour, min) {
    return SLOTS.findIndex(s => s.hour === hour && s.min === min);
  }
  function slotLabel(idx) { return idx >= 0 && idx < SLOTS.length ? SLOTS[idx].label : "—"; }

  // ── State ────────────────────────────────────────────────
  let selectedSlots = []; // array of slot indices (contiguous)
  let currentFilter = "all";
  let nextId = 1;
  let bookings = []; // empty — no preloaded data

  // ── Helpers ──────────────────────────────────────────────
  function isBooked(idx) {
    return bookings.some(b => b.date === "today" && idx >= b.startIdx && idx < b.endIdx);
  }
  function bookingAt(idx) {
    return bookings.find(b => b.date === "today" && idx >= b.startIdx && idx < b.endIdx);
  }
  function isRoomFree() {
    const now = new Date();
    const h = now.getHours(), m = now.getMinutes();
    const roundM = Math.floor(m / 15) * 15;
    const idx = slotIndex(h, roundM);
    if (idx < 0) return true;
    return !isBooked(idx);
  }
  function durationLabel(startIdx, endIdx) {
    const mins = (endIdx - startIdx) * 15;
    if (mins < 60) return `${mins} min`;
    const h = Math.floor(mins / 60), rem = mins % 60;
    return rem ? `${h}h ${rem}m` : `${h}h`;
  }

  // ── Render room status ───────────────────────────────────
  function renderRoomStatus() {
    const el = document.getElementById("room-status-badge");
    const free = isRoomFree();
    el.textContent = free ? "Available now" : "In use";
    el.className = "room-status-badge " + (free ? "badge-free" : "badge-busy");
  }

  // ── Render timeline ──────────────────────────────────────
  function renderTimeline() {
    const grid = document.getElementById("timeline-grid");
    // Show slots in rows of 8 (2 hours per row)
    const cols = 8;
    grid.style.gridTemplateColumns = `repeat(${cols}, 52px)`;
    grid.innerHTML = SLOTS.map((s, i) => {
      const booked = isBooked(i);
      const sel    = selectedSlots.includes(i);
      let cls = "tslot";
      if (booked)    cls += " booked";
      else if (sel)  cls += " selected";
      else           cls += " free";
      const b   = booked ? bookingAt(i) : null;
      const tip = booked ? `${b.booker}: ${b.purpose}` : (sel ? "Selected" : "Available");
      return `<div class="${cls}" onclick="toggleSlot(${i})" title="${s.label} — ${tip}">
        <span class="slot-hour">${s.shortH}</span>
        <span class="slot-min">${s.shortM}</span>
      </div>`;
    }).join("");
    document.getElementById("book-sel-btn").style.display = selectedSlots.length ? "inline-flex" : "none";
  }

  function toggleSlot(idx) {
    if (isBooked(idx)) return;
    const pos = selectedSlots.indexOf(idx);
    if (pos === -1) {
      // Only allow contiguous selection
      if (selectedSlots.length === 0) {
        selectedSlots = [idx];
      } else {
        const mn = Math.min(...selectedSlots), mx = Math.max(...selectedSlots);
        if (idx === mn - 1 || idx === mx + 1) {
          selectedSlots.push(idx);
          selectedSlots.sort((a, b) => a - b);
        } else {
          selectedSlots = [idx]; // restart selection
        }
      }
    } else {
      // Only allow removing from edges
      const mn = Math.min(...selectedSlots), mx = Math.max(...selectedSlots);
      if (idx === mn || idx === mx) {
        selectedSlots.splice(pos, 1);
      }
    }
    renderTimeline();
  }

  // ── Render bookings ──────────────────────────────────────
  function renderBookings() {
    let filtered = [...bookings];
    if (currentFilter === "mine")  filtered = filtered.filter(b => b.booker === ME);
    if (currentFilter === "today") filtered = filtered.filter(b => b.date === "today");
    filtered.sort((a, b) => a.startIdx - b.startIdx);
    document.getElementById("booking-count").textContent =
      `${filtered.length} booking${filtered.length !== 1 ? "s" : ""}`;

    const list = document.getElementById("bookings-list");
    if (!filtered.length) {
      list.innerHTML = `<div class="empty-state">
        <i class="ti ti-calendar-off"></i>
        No bookings yet
        <p>Tap "New booking" to reserve the conference room.</p>
      </div>`;
      return;
    }
    list.innerHTML = filtered.map(b => {
      const mine = b.booker === ME;
      const dur  = durationLabel(b.startIdx, b.endIdx);
      return `<div class="booking-card ${mine ? "mine" : "other"}" onclick="openDetail(${b.id})">
        <div class="bc-top">
          <div>
            <div class="bc-title">${b.purpose}</div>
            <div class="bc-time">
              <i class="ti ti-clock" style="font-size:12px;vertical-align:-1px;"></i>
              ${slotLabel(b.startIdx)} – ${slotLabel(b.endIdx)} &nbsp;·&nbsp; ${dur}
            </div>
          </div>
          <span class="bc-badge ${mine ? "badge-mine" : "badge-other"}">${mine ? "Mine" : "Booked"}</span>
        </div>
        <div class="bc-row">
          <div class="bc-avatar ${mine ? "" : "other"}">${b.initials}</div>
          <span class="bc-name">${b.booker}</span>
          ${b.attendees ? `<span style="font-size:11px;color:var(--text-tertiary);margin-left:auto;"><i class="ti ti-users" style="font-size:12px;"></i> ${b.attendees}</span>` : ""}
        </div>
        <div class="bc-actions" onclick="event.stopPropagation()">
          <button class="bc-btn primary" onclick="openDetail(${b.id})"><i class="ti ti-eye" style="font-size:12px;"></i> Details</button>
          ${mine
            ? `<button class="bc-btn danger" onclick="cancelBooking(${b.id})"><i class="ti ti-trash" style="font-size:12px;"></i> Cancel</button>`
            : `<button class="bc-btn" onclick="openReschedule(${b.id})"><i class="ti ti-refresh" style="font-size:12px;"></i> Request reschedule</button>`}
        </div>
      </div>`;
    }).join("");
  }

  function setFilter(f, el) {
    currentFilter = f;
    document.querySelectorAll(".ftab").forEach(t => t.classList.remove("active"));
    el.classList.add("active");
    renderBookings();
  }

  // ── Modal helpers ────────────────────────────────────────
  function openModal(html) {
    document.getElementById("modal-inner").innerHTML = html;
    document.getElementById("modal-overlay").classList.add("open");
  }
  function closeModal() {
    document.getElementById("modal-overlay").classList.remove("open");
    document.getElementById("modal-inner").innerHTML = "";
  }
  function showToast(msg) {
    const bar = document.getElementById("toast-bar");
    document.getElementById("toast-msg").textContent = msg;
    bar.classList.add("show");
    setTimeout(() => bar.classList.remove("show"), 3200);
  }

  // Build slot <select> options
  function slotOpts(selIdx) {
    return SLOTS.map((s, i) =>
      `<option value="${i}" ${i === selIdx ? "selected" : ""}>${s.label}</option>`
    ).join("");
  }

  // ── Book modal ───────────────────────────────────────────
  function openBookModal() {
    const defStart = selectedSlots.length ? Math.min(...selectedSlots) : slotIndex(9, 0);
    const defEnd   = selectedSlots.length ? Math.max(...selectedSlots) + 1 : slotIndex(10, 0);
    openModal(`<h3><i class="ti ti-calendar-plus" style="color:#1D9E75;font-size:18px;"></i>Book conference room</h3>
      <label>Your name *</label>
      <input type="text" id="f-name" placeholder="Enter your name" />
      <label>Purpose / meeting title *</label>
      <input type="text" id="f-purpose" placeholder="e.g. Sprint planning" />
      <label>Start time *</label>
      <select id="f-start">${slotOpts(defStart)}</select>
      <label>End time *</label>
      <select id="f-end">${slotOpts(defEnd >= TOTAL_SLOTS ? TOTAL_SLOTS - 1 : defEnd)}</select>
      <label>Number of attendees</label>
      <input type="number" id="f-att" min="1" max="10" value="1" />
      <label>Notes (optional)</label>
      <textarea id="f-notes" placeholder="Agenda, AV requirements, etc."></textarea>
      <div id="form-error" class="field-error" style="margin-top:10px;"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-confirm" onclick="confirmBooking()">Confirm booking</button>
      </div>`);
  }

  function confirmBooking() {
    const name      = document.getElementById("f-name").value.trim();
    const purpose   = document.getElementById("f-purpose").value.trim();
    const startIdx  = parseInt(document.getElementById("f-start").value);
    const endIdx    = parseInt(document.getElementById("f-end").value);
    const att       = Math.min(parseInt(document.getElementById("f-att").value) || 1, 10);
    const notes     = document.getElementById("f-notes").value.trim();
    const errEl     = document.getElementById("form-error");

    errEl.textContent = "";
    let err = false;
    if (!name)    { document.getElementById("f-name").classList.add("error-outline"); err = true; }
    if (!purpose) { document.getElementById("f-purpose").classList.add("error-outline"); err = true; }
    if (endIdx <= startIdx) {
      document.getElementById("f-end").classList.add("error-outline");
      errEl.textContent = "End time must be after start time."; err = true;
    }
    if (err) return;

    // Conflict check
    const conflict = bookings.some(b =>
      b.date === "today" && !(endIdx <= b.startIdx || startIdx >= b.endIdx)
    );
    if (conflict) {
      errEl.textContent = "This time slot overlaps with an existing booking. Please choose another time.";
      return;
    }

    const isSelf   = name.toLowerCase() === "you";
    const initials = isSelf ? MI : name.split(" ").map(w => w[0]?.toUpperCase() || "").slice(0, 2).join("") || "?";
    bookings.push({
      id: nextId++,
      booker: isSelf ? ME : name,
      initials,
      purpose,
      startIdx,
      endIdx,
      date: "today",
      attendees: att,
      notes
    });
    selectedSlots = [];
    closeModal();
    renderRoomStatus(); renderTimeline(); renderBookings();
    showToast("Room booked successfully");
  }

  // ── Detail modal ─────────────────────────────────────────
  function openDetail(id) {
    const b = bookings.find(x => x.id === id); if (!b) return;
    const mine = b.booker === ME;
    const dur  = durationLabel(b.startIdx, b.endIdx);
    openModal(`<h3><i class="ti ti-info-circle" style="color:#1D9E75;font-size:18px;"></i>Booking details</h3>
      <div class="detail-row"><span class="detail-label">Room</span><span class="detail-value">Conference Room</span></div>
      <div class="detail-row"><span class="detail-label">Location</span><span class="detail-value">Ground Floor, Block B</span></div>
      <div class="detail-row"><span class="detail-label">Booked by</span><span class="detail-value">${b.booker}</span></div>
      <div class="detail-row"><span class="detail-label">Purpose</span><span class="detail-value">${b.purpose}</span></div>
      <div class="detail-row"><span class="detail-label">Start</span><span class="detail-value">${slotLabel(b.startIdx)}</span></div>
      <div class="detail-row"><span class="detail-label">End</span><span class="detail-value">${slotLabel(b.endIdx)}</span></div>
      <div class="detail-row"><span class="detail-label">Duration</span><span class="detail-value">${dur}</span></div>
      <div class="detail-row"><span class="detail-label">Attendees</span><span class="detail-value">${b.attendees}</span></div>
      ${b.notes ? `<div class="detail-row"><span class="detail-label">Notes</span><span class="detail-value">${b.notes}</span></div>` : ""}
      <div class="modal-actions">
        ${!mine
          ? `<button class="btn-cancel" onclick="closeModal();setTimeout(()=>openReschedule(${b.id}),50)"><i class="ti ti-refresh" style="font-size:13px;"></i> Request reschedule</button>`
          : `<button class="btn-cancel" style="color:#993C1D;border-color:#F0997B;" onclick="cancelBooking(${b.id})"><i class="ti ti-trash" style="font-size:13px;"></i> Cancel</button>`}
        <button class="btn-confirm" onclick="closeModal()">Close</button>
      </div>`);
  }

  // ── Reschedule modal ─────────────────────────────────────
  function openReschedule(id) {
    const b = bookings.find(x => x.id === id); if (!b) return;
    openModal(`<h3><i class="ti ti-refresh" style="color:#1D9E75;font-size:18px;"></i>Request reschedule</h3>
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:1rem;">
        Requesting a reschedule for <strong style="color:var(--text-primary);">${b.purpose}</strong> booked by ${b.booker}.
      </p>
      <label>Preferred new start time</label>
      <select id="rs-start">${slotOpts(b.startIdx)}</select>
      <label>Preferred new end time</label>
      <select id="rs-end">${slotOpts(b.endIdx)}</select>
      <label>Reason for request *</label>
      <textarea id="rs-reason" placeholder="Briefly explain why you need this slot…"></textarea>
      <div id="rs-error" class="field-error" style="margin-top:8px;"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-confirm" onclick="sendReschedule(${id})">Send request</button>
      </div>`);
  }

  function sendReschedule(id) {
    const reason = document.getElementById("rs-reason").value.trim();
    if (!reason) {
      document.getElementById("rs-reason").classList.add("error-outline");
      document.getElementById("rs-error").textContent = "Please provide a reason.";
      return;
    }
    closeModal();
    showToast("Reschedule request sent");
  }

  // ── Cancel ───────────────────────────────────────────────
  function cancelBooking(id) {
    if (!confirm("Cancel this booking?")) return;
    bookings = bookings.filter(b => b.id !== id);
    closeModal();
    renderRoomStatus(); renderTimeline(); renderBookings();
    showToast("Booking cancelled");
  }

  // ── Init ─────────────────────────────────────────────────
  function initDate() {
    const now    = new Date();
    const days   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    document.getElementById("today-date").textContent =
      `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
    document.getElementById("today-day").textContent = days[now.getDay()];
  }

  initDate();
  renderRoomStatus();
  renderTimeline();
  renderBookings();
</script>
</body>
</html>
